spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/kgdemo}
spring.datasource.username=${DATABASE_USERNAME:kgdemo}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.h2.console.enabled=false
server.error.include-message=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=true
app.admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
app.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
inicis.mode=${INICIS_MODE:staging}
inicis.mid=${INICIS_MID:}
inicis.hash-key=${INICIS_HASH_KEY:}
app.public-url=${APP_PUBLIC_URL:}

