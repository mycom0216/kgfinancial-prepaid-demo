# 초보자용은 H2, PostgreSQL로 실행할 때는 SPRING_PROFILES_ACTIVE=postgres를 사용해요.
spring.datasource.url=jdbc:h2:mem:kgdemo;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.h2.console.enabled=true
server.error.include-message=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
app.admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
app.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
inicis.mode=${INICIS_MODE:staging}
inicis.mid=${INICIS_MID:}
inicis.hash-key=${INICIS_HASH_KEY:}
app.public-url=${APP_PUBLIC_URL:}
app.mobile-token-ttl-ms=${MOBILE_TOKEN_TTL_MS:43200000}

