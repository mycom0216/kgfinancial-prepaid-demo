services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kgdemo
      POSTGRES_USER: kgdemo
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in your environment}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - kgfinancial-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kgdemo -d kgdemo"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  kgfinancial-db:
