<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>선불카드 서비스</title>
  <link rel="stylesheet" href="/dashboard.css">
  <script src="/dashboard.js" defer></script>
</head>
<body>
  <header class="top">
    <div class="shell top-inner">
      <a href="/">선불카드 서비스</a>
      <div id="session" hidden><span id="account"></span><button type="button" id="logout" class="secondary">로그아웃</button></div>
    </div>
  </header>
  <main class="shell">
    <h1>선불카드 관리</h1>
    <p id="notice" role="status" aria-live="polite"></p>
    <section id="guest" class="grid" hidden>
      <form id="login" class="panel">
        <h2>로그인</h2>
        <label>아이디<input name="username" autocomplete="username" required></label>
        <label>비밀번호<input type="password" name="password" autocomplete="current-password" required></label>
        <button type="submit">로그인</button>
      </form>
      <form id="register" class="panel">
        <h2>회원가입</h2>
        <label>아이디<input name="username" autocomplete="username" minlength="3" maxlength="40"
          pattern="[A-Za-z0-9_.\-]+" required></label>
        <label>비밀번호<input type="password" name="password" autocomplete="new-password"
          minlength="12" maxlength="72" required></label>
        <p class="muted">아이디는 영문, 숫자, 마침표, 밑줄, 하이픈을 사용할 수 있습니다. 비밀번호는 12자 이상, UTF-8 기준 72바이트 이하입니다.</p>
        <button type="submit">가입하기</button>
      </form>
    </section>
    <section id="wallet" hidden>
      <p id="sandbox-label" class="badge" hidden>로컬 샌드박스 · 연습용 잔액</p>
      <div class="grid">
        <section class="panel">
          <div class="toolbar"><h2>내 카드</h2><button id="issue" type="button" class="secondary">카드 발급</button></div>
          <p id="empty">카드를 발급하면 잔액과 거래 내역을 확인할 수 있습니다.</p>
          <div id="selected-card" hidden>
            <label>카드 선택<select id="card"></select></label>
            <p class="muted balance-label">사용 가능 잔액</p>
            <p id="balance" class="balance"></p>
          </div>
        </section>
        <form id="transaction" class="panel" hidden>
          <h2>잔액 사용</h2>
          <label>거래 유형
            <select name="action">
              <option value="pay">연습 결제</option>
              <option value="top-up" id="top-up" hidden disabled>샌드박스 충전</option>
            </select>
          </label>
          <label>금액 (원)<input name="amount" type="number" min="1" max="1000000000" step="1" inputmode="numeric" required></label>
          <button type="submit">거래 실행</button>
        </form>
      </div>
      <section id="history" class="panel" hidden>
        <div class="toolbar">
          <h2>거래 내역</h2>
          <label>거래 유형
            <select id="filter">
              <option value="">전체</option>
              <option value="연습 결제">연습 결제</option>
              <option value="샌드박스 충전">샌드박스 충전</option>
              <option value="이니시스 충전">이니시스 충전</option>
            </select>
          </label>
          <label>정렬
            <select id="sort"><option value="latest">최신순</option><option value="oldest">오래된순</option></select>
          </label>
        </div>
        <div class="table-scroll">
          <table><thead><tr><th scope="col">거래</th><th scope="col">금액</th><th scope="col">거래 시각</th></tr></thead><tbody id="history-rows"></tbody></table>
        </div>
      </section>
    </section>
    <section id="admin" class="panel" hidden>
      <div class="toolbar"><h2>관리자</h2><button type="button" id="admin-refresh" class="secondary">새로고침</button></div>
      <div class="grid">
        <div class="table-scroll">
          <h3>전체 카드</h3>
          <table><thead><tr><th scope="col">카드</th><th scope="col">잔액</th></tr></thead><tbody id="admin-cards"></tbody></table>
        </div>
        <div class="table-scroll">
          <h3>최근 감사 기록</h3>
          <table><thead><tr><th scope="col">계정</th><th scope="col">동작</th><th scope="col">대상</th><th scope="col">시각</th></tr></thead><tbody id="admin-logs"></tbody></table>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
